name: restore-app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-app.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore app.js and remove this workflow
        run: |
          git show 9e329eee0c492bf35772cb54a6c3570b2b92c04d:js/app.js > js/app.js
          wc -c js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-app.yml
          git add js/app.js .github/workflows/restore-app.yml
          git commit -m "fix: restore complete js/app.js"
          git push

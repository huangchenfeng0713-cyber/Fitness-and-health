name: Apply smoke contract update

on:
  push:
    branches: [codex/v2.10.1-ui-usability]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply smoke contract patch
        run: python3 tools/fix_smoke_contract.py
      - name: Run unit tests
        run: npm test
      - name: Commit patch and clean temporary files
        run: |
          rm -f tools/fix_smoke_contract.py .github/workflows/apply-smoke-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align smoke check with current hero UI"
          git push origin HEAD:codex/v2.10.1-ui-usability

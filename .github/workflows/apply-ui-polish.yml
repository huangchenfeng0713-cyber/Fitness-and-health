name: Apply UI usability patch

on:
  push:
    branches: [codex/v2.10.1-ui-usability]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        run: python3 tools/apply_ui_polish.py
      - name: Run unit tests and capture diagnostics
        run: |
          set +e
          npm test > test-run.log 2>&1
          status=$?
          cat test-run.log
          echo "$status" > test-run.status
          exit 0
      - name: Commit patched sources and diagnostics
        run: |
          rm -f tools/apply_ui_polish.py .github/workflows/apply-ui-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish fitness filters and app usability"
          git push origin HEAD:codex/v2.10.1-ui-usability

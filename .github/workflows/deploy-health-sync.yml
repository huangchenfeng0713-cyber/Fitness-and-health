# 部署 health-sync Edge Function。
#
# 网页走 GitHub Pages 自动更新，但 Supabase 的 Edge Function 是另一套，
# 合并代码不会让它上线，必须单独部署——上线过一次事故就是这么来的：
# 服务端还是旧版，白天同步时静息心率为 0 会让整次上传 400，
# 步数和能量一起丢，而网页那边看起来一切正常。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配一个 secret：
#   SUPABASE_ACCESS_TOKEN  —— Supabase 后台 Account → Access Tokens 生成
#     · 权限至少要有 Edge Functions 的写入
#     · 有效期别用默认的 7 天：过期后这个流程会开始失败，而网页照常更新，
#       又会变成「前端是新的、服务端是旧的」那种最难查的状态
# 项目 ref 不是机密（它出现在公开的 API 地址里），直接写在下面。
name: 部署 health-sync

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-health-sync.yml'
  # 也可以在 Actions 页面手动点一次（改 secret 后重跑用得上）
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt 不能漏：快捷指令用的是设备令牌，不是 Supabase 用户 JWT，
      # 漏了会让所有上传被网关挡在函数之外，函数里的令牌校验根本没机会跑。
      - name: 部署
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy health-sync \
            --project-ref kdkykrshqiamwecohxgw \
            --no-verify-jwt
